tools:
  - category: mcp
    name_tool: search_regulations
    description: >
      Tra cứu nội dung trong kho nội quy, quy định và quy trình nội bộ theo
      câu hỏi tự do . Đây là tool DUY NHẤT để tìm thông tin nội quy của CLB
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Câu hỏi hoặc nội dung cần tra cứu trong kho nội quy."
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          description: "Số đoạn liên quan tối đa cần trả về. Mặc định theo cấu hình API."
        document_ids:
          type: array
          items:
            type: string
          description: "Danh sách document_id để giới hạn phạm vi tìm kiếm (không bắt buộc)."
        rewrite:
          type: boolean
          default: true
          description: "Có dùng LLM của API để viết lại truy vấn trước khi tìm kiếm hay không."
      required:
        - query

  - category: mcp
    name_tool: search_media
    description: >
      Tìm nội dung trong kho video và ảnh của CLB theo câu hỏi tự do: tìm
      keyframe (hình ảnh, caption, chữ trong hình) và lời thoại trong video.
      Đây là tool DUY NHẤT để tìm thông tin về video/ảnh hoạt động của CLB.
      Kết quả trả về kèm video_id và mốc thời gian (giây) để trích dẫn.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Câu hỏi hoặc nội dung cần tìm trong kho video/ảnh."
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          description: "Số kết quả tối đa cho mỗi nguồn. Mặc định theo cấu hình API."
        video_ids:
          type: array
          items:
            type: string
          description: "Danh sách video_id để giới hạn phạm vi tìm kiếm (không bắt buộc)."
        source:
          type: string
          enum:
            - clip
            - transcript
            - both
          default: both
          description: >
            Nguồn cần tìm: 'clip' chỉ tìm keyframe/hình ảnh, 'transcript' chỉ
            tìm lời thoại, 'both' tìm cả hai (mặc định).
        years:
          type: array
          items:
            type: integer
          description: >
            Lọc theo NĂM của bài đăng, nhiều năm là HOẶC. Chỉ truyền khi câu hỏi
            nêu rõ mốc thời gian ("ảnh Open Day 2024", "hoạt động năm ngoái") —
            lọc bừa sẽ loại mất kết quả đúng của năm khác. Kho hiện có 2021-2026.
        events:
          type: array
          items:
            type: string
          description: >
            Lọc theo CHUỖI SỰ KIỆN của bài đăng, nhiều sự kiện là HOẶC. Nhận cả
            tên đầy đủ lẫn slug ("HIT Contest Series" hay "hit-contest-series").
            Chỉ truyền khi câu hỏi gọi TÊN một sự kiện; hỏi chung chung
            ("ảnh sinh hoạt CLB") mà lọc thì mất hết bài chưa gán sự kiện. Không
            phải bài nào cũng thuộc một sự kiện, nên lọc sai tên sẽ trả về rỗng
            chứ không phải trả về kết quả gần đúng.
      required:
        - query
