tools:
  - category: mcp
    name_tool: search_regulations
    description: >
      Tra cứu nội dung trong kho nội quy, quy định và quy trình nội bộ theo
      câu hỏi tự do . Đây là tool DUY NHẤT để tìm thông tin nội quy của CLB
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Câu hỏi hoặc nội dung cần tra cứu trong kho nội quy."
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          description: "Số đoạn liên quan tối đa cần trả về. Mặc định theo cấu hình API."
        document_ids:
          type: array
          items:
            type: string
          description: "Danh sách document_id để giới hạn phạm vi tìm kiếm (không bắt buộc)."
        rewrite:
          type: boolean
          default: true
          description: "Có dùng LLM của API để viết lại truy vấn trước khi tìm kiếm hay không."
      required:
        - query
