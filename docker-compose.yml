# Toàn bộ hệ thống chạy trong Docker [P0-1 · T-01]:
#   hạ tầng  postgres · qdrant · minio
#   ứng dụng api (8000) · mcp (8091) · chatbot (2024) · web (3000)
#
# Chạy:  docker compose up -d --build   →  docker compose ps
# Không có .env → api vẫn boot với default (sqlite + storage filesystem).
#
# `embedding-server` nằm ngoài mặc định (profile `gpu`) — xem cuối file.
#
# Chuỗi phụ thuộc là web → chatbot → mcp → api, nên khi lần lỗi thì đi ngược
# chiều đó: web trắng kết quả thường là api 503 chứ không phải lỗi giao diện.
#
# Bốn service ứng dụng đọc chung .env ở gốc repo qua `env_file`, rồi `environment`
# ghi đè đúng những biến mang tên máy: trong mạng compose, localhost là chính
# container đó chứ không phải máy thật. `environment` luôn thắng `env_file`.
x-env-file: &env-file
  - path: .env
    required: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hit_mira}
      POSTGRES_USER: ${POSTGRES_USER:-hit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hit} -d ${POSTGRES_DB:-hit_mira}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./API
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hit}:${POSTGRES_PASSWORD:-hit}@postgres:5432/${POSTGRES_DB:-hit_mira}
      QDRANT_URL: http://qdrant:6333
      CONFIG_PATH: ${CONFIG_PATH:-./API/Resources/dev.yaml}
      MODELS_PATH: ${MODELS_PATH:-./API/Resources/model.yaml}
      PROMPTS_PATH: ${PROMPTS_PATH:-./API/Resources/prompt.yaml}
      LOG_DIR: ${LOG_DIR:-./logs}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-rag_documents_azure_1536}
      QDRANT_DENSE_VECTOR_SIZE: ${QDRANT_DENSE_VECTOR_SIZE:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # jina-clip-v2 không có repo tokenizer trên HF: bật kiểm tra độ dài là
      # LangChain gửi token id thay cho văn bản, server nhúng trả 422.
      EMBEDDING_CHECK_CTX_LENGTH: ${EMBEDDING_CHECK_CTX_LENGTH:-false}
      # LLM này chỉ dùng cho query rewrite của nhánh nội quy trong API. ChatBot
      # là tiến trình riêng nhưng đọc cùng bộ biến từ .env.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_KEYWORD_THRESHOLD: ${RETRIEVAL_KEYWORD_THRESHOLD:-0.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-hit-mira-media}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      # Nhánh media đọc bộ biến riêng, KHÔNG dùng chung EMBEDDING_* của nhánh nội
      # quy (xem configuration.py). Thiếu chúng thì container vẫn healthy và
      # /api/retrieval/search vẫn chạy, chỉ /api/media/search trả 503 — và tool
      # search_media của MCP chết theo, nên chatbot từ chối mọi câu hỏi ảnh/video.
      JINA_API_KEY: ${JINA_API_KEY:-}
      MEDIA_IMAGE_EMBEDDING_MODEL: ${MEDIA_IMAGE_EMBEDDING_MODEL:-jina-clip-v2}
      MEDIA_IMAGE_EMBEDDING_BASE_URL: ${MEDIA_IMAGE_EMBEDDING_BASE_URL:-}
      # `build_media_embedder()` chọn giữa hai đường tới cùng một model: endpoint
      # Jina trực tiếp (biến ngay trên) hoặc hàng đợi RunPod Serverless. Thiếu cả
      # hai thì /api/media/search trả 503 "Set JINA_API_KEY" — thông báo trỏ nhầm
      # sang đường trực tiếp, nên rất dễ đi sai hướng khi lần lỗi.
      JINA_RUNPOD_ENDPOINT_ID: ${JINA_RUNPOD_ENDPOINT_ID:-}
      MEDIA_EMBEDDING_PROVIDER: ${MEDIA_EMBEDDING_PROVIDER:-}
      # 0 = tắt bộ giữ nhịp. Nó sinh ra để né hạn mức 100k token/phút của Jina;
      # với embedding server tự host thì chỉ làm chậm.
      MEDIA_EMBEDDING_TOKENS_PER_MINUTE: ${MEDIA_EMBEDDING_TOKENS_PER_MINUTE:-}
      MEDIA_IMAGE_EMBEDDING_MAX_SIDE: ${MEDIA_IMAGE_EMBEDDING_MAX_SIDE:-}
      MEDIA_VISION_MODEL_NAME: ${MEDIA_VISION_MODEL_NAME:-}
      MEDIA_VISION_API_BASE_URL: ${MEDIA_VISION_API_BASE_URL:-}
      MEDIA_VISION_API_KEY: ${MEDIA_VISION_API_KEY:-}
      MEDIA_VISION_PROMPT_VERSION: ${MEDIA_VISION_PROMPT_VERSION:-}
      # Phải đi qua đây, không rơi về YAML được: model.yaml cố ý để trống vì
      # tham số này chỉ đúng với backend vLLM. Thiếu nó thì job caption chạy từ
      # màn admin gặp lại ca ảnh nhiều chữ lặp tới cụt token (đo 61,7s/ảnh).
      MEDIA_VISION_REPETITION_PENALTY: ${MEDIA_VISION_REPETITION_PENALTY:-}
      # Auth (T-51): thiếu AUTH_SECRET_KEY thì đăng nhập ném AuthConfigurationError
      # chứ không sinh khoá ngẫu nhiên — cố ý, để lỗi lộ ra ngay.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      MEDIA_FILE_URL_TTL: ${MEDIA_FILE_URL_TTL:-3600}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_API_BASE_URL: ${RUNPOD_API_BASE_URL:-https://api.runpod.ai/v2}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mcp:
    build: ./mcp
    depends_on:
      api:
        condition: service_healthy
    env_file: *env-file
    environment:
      # Tool gọi FastAPI qua tên service, không phải localhost.
      MCP_BASE_URL: http://api:8000
      MCP_CONFIG_PATH: ./mcp/Resources/dev.yaml
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8091
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-internal_rules_rag}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-60}
    ports:
      - "8091:8091"
    healthcheck:
      # Chỉ kiểm tra cổng đã mở. MCP streamable-http không có endpoint health, và
      # GET trần vào /mcp trả 406 (thiếu Accept) — đúng nhưng trông như hỏng.
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.create_connection(('127.0.0.1',8091),2); s.close()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  chatbot:
    build: ./ChatBot
    depends_on:
      mcp:
        condition: service_healthy
    env_file: *env-file
    environment:
      BASE_MCP_SERVER_URL: http://mcp:8091/mcp
      BASE_MCP_SERVER_TRANSPORT: ${BASE_MCP_SERVER_TRANSPORT:-streamable_http}
      LOG_DIR: /app/ChatBot/logs
      # Bốn khoá LLM: chatbot là chỗ duy nhất sinh câu trả lời, thiếu khoá thì
      # tool vẫn chạy, retrieval vẫn ra kết quả, chỉ khâu tổng hợp chết.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "2024:2024"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:2024/ok',timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        # Cả bốn đọc lúc build, không phải lúc chạy — xem web/Dockerfile.
        # Hai cái dưới đi vào bundle trình duyệt: để tương đối thì trình duyệt
        # chỉ gọi về cổng 3000 nó đang mở, nên đổi IP máy chủ không phải build
        # lại. Điền IP tuyệt đối vào đây là khoá cứng ảnh vào một máy chủ.
        BACKEND_API_ORIGIN: http://api:8000
        BACKEND_LANGGRAPH_ORIGIN: http://chatbot:2024
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
        NEXT_PUBLIC_LANGGRAPH_URL: ${NEXT_PUBLIC_LANGGRAPH_URL:-/langgraph}
    depends_on:
      api:
        condition: service_healthy
      chatbot:
        condition: service_started
    ports:
      - "3000:3000"

  # Máy chủ nhúng jina-clip-v2 tự host. KHÔNG chạy mặc định: cần GPU và ~3,5GB
  # trọng số nướng vào ảnh, còn đường dùng thật là RunPod Serverless (xem
  # `build_media_embedder()`). Bật khi muốn chạy hoàn toàn ngoại tuyến:
  #   docker compose --profile gpu up -d embedding-server
  # rồi đặt MEDIA_IMAGE_EMBEDDING_BASE_URL=http://embedding-server:8100 cho api.
  embedding-server:
    profiles: ["gpu"]
    build: ./embedding_server
    ports:
      - "8100:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


volumes:
  pgdata:
  qdrant_storage:
  minio_data:
