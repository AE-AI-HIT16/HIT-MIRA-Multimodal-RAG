# Hạ tầng local [P0-1 · T-01] — postgres + qdrant + minio + api.
# Chạy:  docker compose up -d   →  docker compose ps  (cả 4 service healthy)
# Không có .env → api vẫn boot với default (sqlite + storage filesystem).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hit_mira}
      POSTGRES_USER: ${POSTGRES_USER:-hit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hit} -d ${POSTGRES_DB:-hit_mira}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./API
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hit}:${POSTGRES_PASSWORD:-hit}@postgres:5432/${POSTGRES_DB:-hit_mira}
      QDRANT_URL: http://qdrant:6333
      CONFIG_PATH: ${CONFIG_PATH:-./API/Resources/dev.yaml}
      MODELS_PATH: ${MODELS_PATH:-./API/Resources/model.yaml}
      PROMPTS_PATH: ${PROMPTS_PATH:-./API/Resources/prompt.yaml}
      LOG_DIR: ${LOG_DIR:-./logs}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-rag_documents_azure_1536}
      QDRANT_DENSE_VECTOR_SIZE: ${QDRANT_DENSE_VECTOR_SIZE:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # jina-clip-v2 không có repo tokenizer trên HF: bật kiểm tra độ dài là
      # LangChain gửi token id thay cho văn bản, server nhúng trả 422.
      EMBEDDING_CHECK_CTX_LENGTH: ${EMBEDDING_CHECK_CTX_LENGTH:-false}
      # LLM này chỉ dùng cho query rewrite của nhánh nội quy trong API. ChatBot
      # là tiến trình riêng nhưng đọc cùng bộ biến từ .env.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_KEYWORD_THRESHOLD: ${RETRIEVAL_KEYWORD_THRESHOLD:-0.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-hit-mira-media}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      # Nhánh media đọc bộ biến riêng, KHÔNG dùng chung EMBEDDING_* của nhánh nội
      # quy (xem configuration.py). Thiếu chúng thì container vẫn healthy và
      # /api/retrieval/search vẫn chạy, chỉ /api/media/search trả 503 — và tool
      # search_media của MCP chết theo, nên chatbot từ chối mọi câu hỏi ảnh/video.
      JINA_API_KEY: ${JINA_API_KEY:-}
      MEDIA_IMAGE_EMBEDDING_MODEL: ${MEDIA_IMAGE_EMBEDDING_MODEL:-jina-clip-v2}
      MEDIA_IMAGE_EMBEDDING_BASE_URL: ${MEDIA_IMAGE_EMBEDDING_BASE_URL:-}
      # `build_media_embedder()` chọn giữa hai đường tới cùng một model: endpoint
      # Jina trực tiếp (biến ngay trên) hoặc hàng đợi RunPod Serverless. Thiếu cả
      # hai thì /api/media/search trả 503 "Set JINA_API_KEY" — thông báo trỏ nhầm
      # sang đường trực tiếp, nên rất dễ đi sai hướng khi lần lỗi.
      JINA_RUNPOD_ENDPOINT_ID: ${JINA_RUNPOD_ENDPOINT_ID:-}
      MEDIA_EMBEDDING_PROVIDER: ${MEDIA_EMBEDDING_PROVIDER:-}
      # 0 = tắt bộ giữ nhịp. Nó sinh ra để né hạn mức 100k token/phút của Jina;
      # với embedding server tự host thì chỉ làm chậm.
      MEDIA_EMBEDDING_TOKENS_PER_MINUTE: ${MEDIA_EMBEDDING_TOKENS_PER_MINUTE:-}
      MEDIA_IMAGE_EMBEDDING_MAX_SIDE: ${MEDIA_IMAGE_EMBEDDING_MAX_SIDE:-}
      MEDIA_VISION_MODEL_NAME: ${MEDIA_VISION_MODEL_NAME:-}
      MEDIA_VISION_API_BASE_URL: ${MEDIA_VISION_API_BASE_URL:-}
      MEDIA_VISION_API_KEY: ${MEDIA_VISION_API_KEY:-}
      MEDIA_VISION_PROMPT_VERSION: ${MEDIA_VISION_PROMPT_VERSION:-}
      # Phải đi qua đây, không rơi về YAML được: model.yaml cố ý để trống vì
      # tham số này chỉ đúng với backend vLLM. Thiếu nó thì job caption chạy từ
      # màn admin gặp lại ca ảnh nhiều chữ lặp tới cụt token (đo 61,7s/ảnh).
      MEDIA_VISION_REPETITION_PENALTY: ${MEDIA_VISION_REPETITION_PENALTY:-}
      # Auth (T-51): thiếu AUTH_SECRET_KEY thì đăng nhập ném AuthConfigurationError
      # chứ không sinh khoá ngẫu nhiên — cố ý, để lỗi lộ ra ngay.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      MEDIA_FILE_URL_TTL: ${MEDIA_FILE_URL_TTL:-3600}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_API_BASE_URL: ${RUNPOD_API_BASE_URL:-https://api.runpod.ai/v2}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5


volumes:
  pgdata:
  qdrant_storage:
  minio_data:
