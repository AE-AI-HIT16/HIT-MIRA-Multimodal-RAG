[project]
name = "hit-mira-chatbot"
version = "0.1.0"
description = "HIT-MIRA ChatBot – LangGraph-based multi-agent chatbot with MCP tool integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---- LangChain / LangGraph core ----
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.8.0",

    # ---- MCP integration ----
    "langchain-mcp-adapters>=0.1.0",

    # ---- Model providers ----
    "langchain-openai>=0.3.0",

    # ---- Config & utilities ----
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "src"
source-include = ["langgraph.json", ".env.example", "Makefile", "Resources/**"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
