[project]
name = "hit-mira-chatbot"
version = "0.1.0"
description = "HIT-MIRA ChatBot – LangGraph-based multi-agent chatbot with MCP tool integration"
requires-python = ">=3.11"
dependencies = [
    # ---- LangChain / LangGraph core ----
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.8.0",

    # ---- MCP integration ----
    "langchain-mcp-adapters>=0.1.0",

    # ---- Model providers ----
    "langchain-openai>=0.3.0",

    # ---- Config & utilities ----
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typing-extensions>=4.12.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["Resources/**", "langgraph.json", "Makefile"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
