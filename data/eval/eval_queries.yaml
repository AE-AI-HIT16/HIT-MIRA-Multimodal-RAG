# Tập đánh giá có nhãn — T-70 / US-601.1 / TC-601
#
# CÁCH GÁN NHÃN, và vì sao làm vậy
# --------------------------------
# Nhãn KHÔNG được lấy từ đầu ra của chính hệ thống truy xuất — làm thế là lấy
# đáp án của bài thi từ bài làm, và Recall@k sẽ luôn bằng 1.0. Ở đây mỗi câu hỏi
# mang một `tu_khoa`, và đáp án đúng là **mọi đơn vị chứa đủ các từ khoá đó**
# trong trường `truong` — một kênh khớp chuỗi, độc lập với không gian vector
# đang được đo. `scripts/build_eval_labels.py` giải luật này ra `eval_queries.json`.
#
# Câu hỏi cố ý viết bằng lời người dùng thật, KHÔNG chép câu chữ trong caption.
# Chép lại thì phép đo chỉ còn là đo khớp chuỗi, và điểm đẹp một cách vô nghĩa.
#
# VÌ SAO TÁCH `media_image` VÀ `media_image_ocr`
# ---------------------------------------------
# Đo trên kho thật: tên sự kiện (Open Day, hackathon, seminar, gala, chuyển giao
# ban chủ nhiệm, online judge) xuất hiện **0 lần trong caption** và chỉ nằm
# trong OCR — caption chỉ tả cảnh chung ("một nhóm người trong phòng họp"), còn
# danh tính sự kiện nằm ở chữ trên banner.
#
# Mà vector trong `media_clip` là vector của **hình ảnh**, không phải của chuỗi
# OCR. Nên "cho tôi xem ảnh HIT Open Day" đòi hệ thống đọc chữ trong ảnh —
# đúng thứ `CLAUDE.md` đã hoãn sang v2 (OCR + hybrid keyword search). Gộp chung
# vào một con số sẽ vừa dìm chỉ số chính, vừa che mất bản chất: đây là **giới
# hạn phạm vi v1 đã biết**, không phải lỗi truy xuất.
#
# Vậy nên:
#   - `media_image`     nhãn theo CAPTION — đo đúng thứ v1 hứa: tìm theo nội
#                       dung nhìn thấy được. Vào chỉ số chính.
#   - `media_image_ocr` nhãn theo OCR — đo khoảng trống v2. Báo cáo riêng,
#                       KHÔNG vào chỉ số chính, nhưng phải hiện ra để có số mà
#                       quyết định làm hybrid search hay không.
#
# `ngoai_mien` cũng không vào Recall/MRR — kho không có đáp án đúng nào. Chúng
# dùng để đo phân bố điểm, tức lấy số liệu đặt ngưỡng "không tìm thấy" (T-33):
# nếu điểm cao nhất của câu ngoài miền chồng lấn điểm câu trong miền thì không
# ngưỡng nào cứu được, và phải xử ở tầng trả lời.
#
# US-601.1 AC-2: mục không giải ra nhãn nào bị loại khỏi phép tính kèm cảnh báo.

