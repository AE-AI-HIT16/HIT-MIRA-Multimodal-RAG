[project]
name = "hit-mira-api"
version = "0.1.0"
description = "HIT-MIRA API – FastAPI service for regulation document ingest and retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---- Web API ----
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",

    # ---- Config & validation ----
    "pydantic>=2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",

    # ---- LangChain / RAG ----
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-qdrant>=0.2.0",

    # ---- Vector store ----
    "qdrant-client>=1.12.0",

    # ---- Document parsing ----
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "src"
source-include = ["Resources/**"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
