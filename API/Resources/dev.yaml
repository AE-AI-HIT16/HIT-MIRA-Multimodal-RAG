LOG:
  LOG_DIR: ${LOG_DIR}

QDRANT:
  URL: ${QDRANT_URL}
  API_KEY: ${QDRANT_API_KEY}
  COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
  DENSE_VECTOR_SIZE: ${QDRANT_DENSE_VECTOR_SIZE}

EMBEDDING:
  API_KEY: ${EMBEDDING_API_KEY}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS} 
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}

PIPELINE:
  CHUNK_SIZE: 1200
  CHUNK_OVERLAP: 150
  MINIMUM_CHUNK_SIZE: 250

RETRIEVAL:
  TOP_K: ${RETRIEVAL_TOP_K}
  KEYWORD_THRESHOLD: ${RETRIEVAL_KEYWORD_THRESHOLD}

MINIO:
  ENDPOINT: ${MINIO_ENDPOINT}
  ACCESS_KEY: ${MINIO_ACCESS_KEY}
  SECRET_KEY: ${MINIO_SECRET_KEY}
  BUCKET: ${MINIO_BUCKET}
  SECURE: ${MINIO_SECURE}

MEDIA_PIPELINE:
  PARALLEL_ENRICHMENT: true
  STAGE_TIMEOUT:
  RETRY_COUNT: 0
  PARTIAL_SUCCESS_POLICY: true
  SUPPORTED_MEDIA_TYPES:
    - .mp4
    - .mov
    - .mkv
    - .avi
    - .webm
  VALIDATION_STRICTNESS: strict
  MINIMUM_DURATION:
  MAXIMUM_DURATION:
  MINIMUM_SIZE_BYTES:
  MAXIMUM_SIZE_BYTES:
  AUDIO_REQUIRED: false
  ENABLE_OCR: true
  ENABLE_CAPTION: true
  ENABLE_DETECTION: true
  ENABLE_ASR: true
  SHORT_SCENE_THRESHOLD: 10
  KEYFRAME_POSITIONS:
    - 0.15
    - 0.50
    - 0.85
  FPS_FALLBACK: 25.0
  MIN_BLUR_SCORE: 80.0
  MIN_BRIGHTNESS: 30.0
  MAX_BRIGHTNESS: 225.0
  MIN_CONTRAST: 10.0
  BRIGHTNESS_MIDPOINT: 127.5
  QUALITY_FILTER_BYPASS_ON_OPENCV_UNAVAILABLE: true
  QUALITY_FALLBACK_SELECTION: best_quality_candidate
  SCENE_FALLBACK_SELECTION: middle_frame
  FRAME_ID_PATTERN: "{media_id}_f{index:06d}"
  KEYFRAME_OUTPUT_SORT_ORDER: frame_index
  JPEG_QUALITY: 95
  OCR_BATCH_SIZE: 1
  OCR_ENABLE_PREPROCESSING: true
  OCR_UPSCALE_FACTORS:
    - 1.0
    - 2.0
  OCR_MIN_CONFIDENCE: 0.25
  OCR_TEXT_CLEANUP: true
  OCR_MERGE_IOU_THRESHOLD: 0.45
  OCR_MIN_BOX_WIDTH: 8.0
  OCR_MIN_BOX_HEIGHT: 6.0
  OCR_MIN_BOX_AREA_RATIO: 0.00003
  OCR_MIN_TEXT_CHARS: 2
  OCR_LOGO_MAX_AREA_RATIO: 0.015
  OCR_LOGO_CORNER_MARGIN_RATIO: 0.18
  OCR_LOGO_MAX_CHARS: 8
  OCR_SMALL_REGION_MAX_WIDTH: 220.0
  OCR_SMALL_REGION_MAX_HEIGHT: 48.0
  OCR_REGION_UPSCALE_FACTOR: 2.0
  OCR_REGION_CROP_MARGIN: 4
  OCR_REGION_REFINE_MIN_GAIN: 0.03
  CAPTION_BATCH_SIZE: 1
  DETECTION_BATCH_SIZE: 1
  MISSING_DEPENDENCY_POLICY: skip
  TIMESTAMP_MATCH_STRATEGY: inclusive_interval_match
  CONTEXT_WINDOW: 1
  CONTEXT_TEXT_JOINER: " "
  TIMESTAMP_TOLERANCE:
  CANONICAL_SCHEMA_VERSION: v1
  MERGE_STRATEGY: merge_by_frame_id
  CONFLICT_POLICY: prefer_enrichment
  LANGUAGE_NORMALIZATION_POLICY: preserve
