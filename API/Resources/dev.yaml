LOG:
  LOG_DIR: ${LOG_DIR}

QDRANT:
  URL: ${QDRANT_URL}
  API_KEY: ${QDRANT_API_KEY}
  COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
  DENSE_VECTOR_SIZE: ${QDRANT_DENSE_VECTOR_SIZE}

EMBEDDING:
  API_KEY: ${EMBEDDING_API_KEY}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS} 
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}

PIPELINE:
  CHUNK_SIZE: 1200
  CHUNK_OVERLAP: 150
  MINIMUM_CHUNK_SIZE: 250

RETRIEVAL:
  TOP_K: ${RETRIEVAL_TOP_K}
  KEYWORD_THRESHOLD: ${RETRIEVAL_KEYWORD_THRESHOLD}

MINIO:
  ENDPOINT: ${MINIO_ENDPOINT}
  ACCESS_KEY: ${MINIO_ACCESS_KEY}
  SECRET_KEY: ${MINIO_SECRET_KEY}
  BUCKET: ${MINIO_BUCKET}
  SECURE: ${MINIO_SECURE}

MEDIA_PIPELINE:
  PARALLEL_ENRICHMENT: true
  STAGE_TIMEOUT:
  RETRY_COUNT: 0
  PARTIAL_SUCCESS_POLICY: true
  SUPPORTED_MEDIA_TYPES:
    - .mp4
    - .mov
    - .mkv
    - .avi
    - .webm
  SUPPORTED_IMAGE_TYPES:
    - .jpg
    - .jpeg
    - .png
    - .webp
  VALIDATION_STRICTNESS: strict
  MINIMUM_DURATION:
  MAXIMUM_DURATION:
  MINIMUM_SIZE_BYTES:
  MAXIMUM_SIZE_BYTES:
  AUDIO_REQUIRED: false
  ENABLE_OCR: true
  ENABLE_CAPTION: true
  ENABLE_DETECTION: true
  ENABLE_ASR: true
  SHORT_SCENE_THRESHOLD: 10
  KEYFRAME_BASE_POSITIONS:
    - 0.15
    - 0.5
    - 0.85
  KEYFRAME_LONG_SCENE_INTERVAL_SEC: 2.5
  KEYFRAME_MAX_CANDIDATES_PER_SCENE: 8
  # Hai keyframe cách nhau quá ngần này giây thì không so trùng với nhau nữa.
  # Giữ độ phủ thời gian cho video nền sáng, nơi phép đo trùng bằng pixel bị mù.
  KEYFRAME_MAX_GAP_SEC: 10.0
  FPS_FALLBACK: 25.0
  MIN_BLUR_SCORE: 80.0
  MIN_BRIGHTNESS: 30.0
  MAX_BRIGHTNESS: 225.0
  MIN_CONTRAST: 10.0
  BRIGHTNESS_MIDPOINT: 127.5
  QUALITY_BLUR_REFERENCE: 400.0
  QUALITY_CONTRAST_REFERENCE: 64.0
  QUALITY_BLUR_WEIGHT: 0.45
  QUALITY_BRIGHTNESS_WEIGHT: 0.25
  QUALITY_CONTRAST_WEIGHT: 0.30
  QUALITY_FALLBACK_SELECTION: best_quality_candidate
  FRAME_ID_PATTERN: "{media_id}_f{index:06d}"
  KEYFRAME_OUTPUT_SORT_ORDER: frame_index
  JPEG_QUALITY: 90
  DETECTION_BATCH_SIZE: 1
  MISSING_DEPENDENCY_POLICY: skip
  TIMESTAMP_MATCH_STRATEGY: inclusive_interval_match
  CONTEXT_WINDOW: 1
  CONTEXT_TEXT_JOINER: " "
  TIMESTAMP_TOLERANCE:
  CANONICAL_SCHEMA_VERSION: v1
  MERGE_STRATEGY: merge_by_frame_id
  CONFLICT_POLICY: prefer_enrichment
  LANGUAGE_NORMALIZATION_POLICY: preserve
