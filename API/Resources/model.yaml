OPENAI_LLM_MODEL:
  MODEL_NAME: "gpt-5.5"
  MODEL_PATH: "openai:gpt-5.5"

MEDIA_MODELS:
  TEMPORAL_MODEL_NAME: TransNetV2
  TEMPORAL_CHECKPOINT_NAME: transnetv2-pytorch-weights.pth
  TEMPORAL_CHECKPOINT_DIR: data/models
  TEMPORAL_CHECKPOINT_SOURCE_POLICY: local_artifact_then_remote_artifact_source
  TEMPORAL_SCENE_DETECTOR_ENABLED: true
  TEMPORAL_DEVICE_POLICY: auto
  FRAME_RESIZE_WIDTH: 48
  FRAME_RESIZE_HEIGHT: 27
  TEMPORAL_MODEL_F: 16
  TEMPORAL_MODEL_L: 3
  TEMPORAL_MODEL_S: 2
  TEMPORAL_MODEL_D: 1024
  USE_MANY_HOT_TARGETS: true
  USE_FRAME_SIMILARITY: true
  USE_COLOR_HISTOGRAMS: true
  USE_MEAN_POOLING: false
  DROPOUT_RATE: 0.5
  POOL_TYPE: avg
  STOCHASTIC_DEPTH_DROP_PROB: 0.0
  BATCH_NORM: true
  BATCH_NORM_EPS: 0.001
  SEPARABLE_CONVOLUTION: true
  FRAME_SIMILARITY_USE_BIAS: true
  FRAME_SIMILARITY_LOOKUP_WINDOW: 101
  FRAME_SIMILARITY_DIM: 128
  COLOR_HIST_LOOKUP_WINDOW: 101
  COLOR_HIST_OUTPUT_DIM: 128
  INPUT_FRAME_SHAPE: 27x48 RGB uint8
  WINDOW_LENGTH: 100
  WINDOW_STRIDE: 50
  LEADING_PADDING_FRAMES: 25
  CENTER_SLICE_START: 25
  CENTER_SLICE_END: 75
  SHOT_BOUNDARY_THRESHOLD: 0.3
  DUPLICATE_THRESHOLD: 0.90
  CLIP_MODEL_NAME: openai/clip-vit-base-patch32
  SIMILARITY_METRIC: cosine
  OCR_LANGUAGES:
    - vi
    - en
  OCR_VERSION: PP-OCRv5
  OCR_DETECTION_MODEL_NAME: PP-OCRv5_server_det
  OCR_RECOGNITION_MODEL_NAME: latin_PP-OCRv5_server_rec
  OCR_USE_DOC_ORIENTATION_CLASSIFY: false
  OCR_USE_DOC_UNWARPING: false
  OCR_USE_TEXTLINE_ORIENTATION: true
  OCR_GPU: true
  CAPTION_MODEL_NAME: microsoft/Florence-2-base-ft
  CAPTION_MODEL_VERSION: base-ft
  CAPTION_TRUST_REMOTE_CODE: true
  CAPTION_MAX_NEW_TOKENS: 100
  CAPTION_DEVICE: cuda
  CAPTION_DTYPE: float16
  CAPTION_DEPENDENCY_VERSION: transformers
  DETECTION_MODEL_NAME: yolo11n
  DETECTION_WEIGHT_FILE: yolo11n.pt
  DETECTION_CONFIDENCE_THRESHOLD: 0.5
  DETECTION_NMS_POLICY: default_yolo_nms
  DETECTION_DEVICE_POLICY: runtime_default
  DETECTION_VERBOSE: false
  DETECTION_DEPENDENCY_VERSION: ultralytics
  ASR_BACKEND: sherpa_onnx
  ASR_MODEL_NAME: hynt/Zipformer-30M-RNNT-6000h
  SHERPA_ENCODER_FILE: encoder-epoch-20-avg-10.onnx
  SHERPA_DECODER_FILE: decoder-epoch-20-avg-10.onnx
  SHERPA_JOINER_FILE: joiner-epoch-20-avg-10.onnx
  SHERPA_TOKENS_FILE: config.json
  SHERPA_PROVIDER: cpu
  SHERPA_NUM_THREADS: 1
  SHERPA_SAMPLE_RATE: 16000
  SHERPA_FEATURE_DIM: 80
  SHERPA_DECODING_METHOD: greedy_search
  SHERPA_CHUNK_DURATION_SEC: 60
  SHERPA_DEBUG: false
  ASR_LANGUAGE: vi
  ASR_DEPENDENCY_VERSION: sherpa-onnx + huggingface-hub
